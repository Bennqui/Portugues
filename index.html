<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Tuca Idiomas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#F1F8F4">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap">
<style>
/* Identidad propia: fresca y juguetona. Verde menta, amarillo sol y azul mar; Fredoka (redonda) para títulos y Nunito para leer.
   Tarjetas gruesas con sombra suave y botones con relieve, como fichas de juego. La mascota es Tuca, un tucán. */
:root{--bg:#F1F8F4;--card:#fff;--ink:#173B2F;--mut:#5F7B70;--line:#DDEEE5;--soft:#E8F4EE;--g:#12A06A;--gd:#0B7A50;--sun:#FFC531;--sund:#D9A300;--sea:#2E8BEA;--sead:#1F6CC0;--bad:#E5484D;--badd:#B8323A;--okbg:#DDF5E9;--badbg:#FDE7E7;
--fd:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;--sh:0 1px 0 var(--line),0 10px 28px rgba(18,90,60,.07);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{overflow-x:hidden}
input,select,textarea{font-size:max(16px,1em)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5;
padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(118px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.lock{overflow:hidden}
#m{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1.ttl{font-size:2rem;margin:12px 2px 4px}
.sec{font-family:var(--fd);font-weight:600;font-size:1.25rem;margin:26px 4px 8px}
.mut{color:var(--mut)}.small{font-size:.88rem}
p{margin:6px 0}
a{color:var(--sead);font-weight:700}
.view{animation:in .4s ease both}
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{min-height:54px;padding:10px 22px;border-radius:18px;background:var(--g);color:#fff;font-family:var(--fd);font-weight:600;font-size:1.08rem;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--gd);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 transparent}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--bad);box-shadow:0 5px 0 var(--badd)}
.btn.sun{background:var(--sun);color:#3B2E00;box-shadow:0 5px 0 var(--sund)}
.btn.sea{background:var(--sea);box-shadow:0 5px 0 var(--sead)}
.w{width:100%}
.row{display:flex;gap:12px;margin:12px 0}.row>*{flex:1}.row.c{justify-content:center}.row.c>*{flex:0 0 auto}
.ic{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.25rem;display:inline-grid;place-items:center;transition:transform .08s}
.ic:active{transform:translateY(3px);box-shadow:none}
.ic.s{width:40px;height:40px;font-size:1rem;vertical-align:middle;margin-left:8px}
.lnk{color:var(--sead);font-weight:800;padding:8px 4px}.lnk.red{color:var(--bad)}
.chipst{font-family:var(--fd);font-weight:600;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--sh);white-space:nowrap}

/* Barra flotante */
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:20;width:min(calc(100% - 28px),440px)}
.pill{flex:1;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(18,70,50,.16)}
.pill button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 5px;border-radius:999px;font-size:.74rem;font-weight:800;color:var(--mut);transition:background .2s,color .2s}
.pill svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.pill button.on{background:var(--soft);color:var(--gd)}.pill button.on svg{transform:scale(1.1)}
.go{position:relative;width:66px;height:66px;border-radius:50%;background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd),0 12px 26px rgba(18,160,106,.35);display:grid;place-items:center;flex:none;transition:transform .08s}
.go:active{transform:translateY(5px);box-shadow:0 0 0 var(--gd)}
.go svg{width:26px;height:26px;fill:#fff;margin-left:3px}
.go.need::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--g);animation:ring 2s infinite;pointer-events:none}

/* Aprender */
.head{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.tc{width:80px;height:80px;flex:none;padding:0}
.tc svg{width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;overflow:visible}
.tc.hop svg{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.sp{flex:1;position:relative;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--sh);line-height:1.3}
.sp::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.sp b{font-family:var(--fd);font-weight:600;font-size:1.12rem;display:block}.sp span{font-size:.88rem;color:var(--mut)}
.goal{display:flex;align-items:center;gap:16px}
.rw{position:relative;width:70px;height:70px;flex:none}
.ring{width:70px;height:70px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--soft);stroke-width:8}
.rfg{fill:none;stroke:var(--g);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.3,1,.4,1)}
.rtx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);font-weight:600;line-height:1}
.rtx small{font-family:var(--fb);font-size:.65rem;color:var(--mut);font-weight:700}
.week{display:flex;gap:6px;margin-top:8px}
.week span{width:26px;height:26px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--mut)}
.week span.on{background:var(--g);color:#fff;animation:pop .4s both}
.week span.today{box-shadow:0 0 0 2px var(--ink) inset}
.study{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#14B377,#0E8E5E);color:#fff;box-shadow:0 6px 0 var(--gd),0 14px 30px rgba(18,160,106,.28);transition:transform .08s}
.study:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gd)}
.sti{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.9rem;flex:none}
.stt{flex:1}.stt small{display:block;font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.stt b{display:block;font-family:var(--fd);font-weight:600;font-size:1.3rem;line-height:1.2}.stt span{font-size:.88rem;opacity:.92}
.stp{width:46px;height:46px;border-radius:50%;background:var(--sun);color:#3B2E00;display:grid;place-items:center;font-size:1.1rem;flex:none;box-shadow:0 3px 0 var(--sund)}
.hoyc .hr{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.hoyc .hr+.hr{border-top:2px dashed var(--line);margin-top:14px;padding-top:14px}
.bubble{width:58px;height:58px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:2rem;flex:none}
.float{animation:float 4s ease-in-out infinite}
.kk{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.pw2{font-family:var(--fd);font-weight:600;font-size:1.3rem;line-height:1.2}
.seg{display:flex;gap:4px;padding:5px;background:#fff;border-radius:999px;margin:18px 0 6px;box-shadow:var(--sh)}
.seg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;font-size:.92rem;color:var(--mut);transition:background .2s,color .2s}
.seg button.on{background:var(--g);color:#fff}

/* Ruta */
.unit{display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:22px;padding:14px 16px;margin:24px 0 4px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#000)}
.un{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--fd);font-weight:600;flex:none}
.ut{font-family:var(--fd);font-weight:600;font-size:1.15rem;line-height:1.2;flex:1}.ut small{display:block;font-family:var(--fb);font-size:.78rem;opacity:.85;font-weight:700}
.ug{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);font-size:1.15rem}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0 6px}
.ndw{position:relative;display:flex;flex-direction:column;align-items:center}
.nd{position:relative;width:72px;height:68px;border-radius:50%;background:#DCE6E1;font-size:1.6rem;box-shadow:0 6px 0 #C2D0C9;transition:transform .08s}
.nd:active{transform:translateY(5px);box-shadow:0 1px 0 #C2D0C9}
.nd.dn,.nd.cur{background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 68%,#000);color:#fff}
.nd.dn{font-size:1.5rem;font-family:var(--fd);font-weight:600}
.nd.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);animation:ring 2s infinite;pointer-events:none}
.nd.lk{font-size:1.1rem;opacity:.8}
.nl{font-size:.76rem;font-weight:700;color:var(--mut);margin-top:8px}
.bub{position:absolute;top:-38px;background:#fff;color:var(--c);font-family:var(--fd);font-weight:600;font-size:.8rem;letter-spacing:.06em;padding:5px 12px;border-radius:12px;white-space:nowrap;box-shadow:var(--sh);animation:bob 2.2s ease-in-out infinite}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}

/* Viaje */
.map{background:linear-gradient(#DFF1FB,#CDE9F8);padding:10px}
.map svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin .pr{transform-box:fill-box;transform-origin:center;animation:ring 2s infinite}
.route{stroke-dasharray:6 6}
.done-route{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.6s .3s ease forwards}
.pc{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.pc.lk{opacity:.55}
.pce{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;flex:none;background:var(--soft)}
.post{border-radius:24px;padding:22px;color:#fff;text-align:left;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));position:relative;overflow:hidden;animation:pop .5s both}
.post .pe1{position:absolute;right:-6px;bottom:-14px;font-size:6rem;opacity:.9;transform:rotate(-8deg)}
.post h3{font-size:1.6rem;margin:2px 0 8px}.post p{max-width:78%;font-size:.95rem;line-height:1.45}
.post .stamp{display:inline-block;border:2px dashed rgba(255,255,255,.7);border-radius:10px;padding:2px 10px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.phr{display:block;margin-top:12px;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;color:#fff;text-align:left;max-width:80%}

/* Jugar / Yo */
.gm{display:flex;gap:14px;align-items:center;width:100%;text-align:left;transition:transform .08s}
.gm:active{transform:scale(.98)}
.gme{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb,var(--c) 16%,#fff);flex:none}
.gm b{font-family:var(--fd);font-weight:600;font-size:1.12rem;display:block}
.gm .rec{display:block;font-size:.8rem;font-weight:800;color:var(--c);margin-top:2px}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stg div{background:var(--soft);border-radius:18px;padding:12px 14px}
.stg b{display:block;font-family:var(--fd);font-weight:600;font-size:1.6rem;line-height:1.1}.stg span{font-size:.82rem;color:var(--mut);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--g);min-height:4px;transform-origin:bottom;animation:grow .8s cubic-bezier(.3,1.3,.5,1) both}
.chart i.z{background:var(--line)}
.chart span{font-size:.72rem;font-weight:800;color:var(--mut)}.chart small{font-size:.68rem;color:var(--mut)}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg button{background:var(--soft);border-radius:18px;padding:12px 6px;text-align:center;font-size:.76rem;font-weight:800;line-height:1.2}
.bdg .be{display:block;font-size:2rem;margin-bottom:4px}
.bdg .off{opacity:.45;filter:grayscale(1)}
.bdg .on{background:#FFF6D6}
details{background:#fff;border-radius:18px;margin:8px 0;box-shadow:var(--sh)}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:54px;font-weight:800}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
.dl{padding:0 16px 10px}
.wr{display:grid;grid-template-columns:40px 1fr auto;width:100%;text-align:left;padding:9px 0;border-top:2px solid var(--soft);align-items:center;column-gap:10px}
.wr .we{grid-row:1/3;font-size:1.5rem}.wr .mut{grid-column:2;font-size:.88rem}
.lv{grid-row:1/3;grid-column:3;display:flex;gap:3px}.lv i{width:7px;height:7px;border-radius:50%;background:var(--line)}.lv i.on{background:var(--g)}
.sg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px;margin:8px 0}
.sg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;font-size:.9rem;color:var(--mut)}
.sg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--soft);margin-top:10px}
.sw small{display:block;color:var(--mut);font-size:.8rem}
.tg{width:52px;height:32px;border-radius:16px;background:#CFDAD4;position:relative;transition:background .2s;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--g)}.tg.on i{transform:translateX(20px)}
.lbl{font-size:.8rem;font-weight:800;color:var(--g);letter-spacing:.06em;text-transform:uppercase}
input,textarea{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);margin:8px 0}
input:focus,textarea:focus{border-color:var(--g);outline:0}
textarea{font-size:16px}

/* Pantalla de sesión */
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.ov.in{animation:up .38s cubic-bezier(.2,.8,.2,1)}
.oh{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;padding:6px 0}
.x{font-size:1.25rem;color:var(--mut);width:40px;height:40px;border-radius:50%;font-weight:800}
.pb{flex:1;height:14px;background:#DCE9E2;border-radius:8px;overflow:hidden}
.pb i{display:block;position:relative;height:100%;width:0;background:var(--g);border-radius:8px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.pb i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
#cmb{min-width:48px;text-align:right;font-family:var(--fd);font-weight:600;color:#F08A24}
#lb{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:8px 2px 24px;-webkit-overflow-scrolling:touch}
#ft{max-width:560px;width:100%;margin:0 auto;padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.fbk{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:18px max(20px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1.12);border-radius:26px 26px 0 0}
.fbk>*{max-width:560px;margin-left:auto;margin-right:auto}
.fbk.show{transform:none}.fbk.good{background:var(--okbg);color:#0E5A3A}.fbk.bad{background:var(--badbg);color:#932A2E}
.fbh{font-family:var(--fd);font-weight:600;font-size:1.45rem}.fbt{font-weight:800;margin:4px 0}.fbn{font-size:.9rem;margin:2px 0}
.fbk .btn{margin-top:12px}
.ex.in{animation:exIn .42s cubic-bezier(.2,.8,.2,1) both}
.tag{font-size:.8rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:8px 0 10px}
.qq{font-family:var(--fd);font-weight:600;font-size:1.9rem;margin:8px 0 18px;line-height:1.2;overflow-wrap:anywhere}
.qq.sm{font-size:1.35rem}
.emo{font-size:5rem;text-align:center;line-height:1;margin:18px auto 10px;width:150px;height:150px;border-radius:44px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.emo.sm{width:96px;height:96px;font-size:3rem;border-radius:30px}
.pw{font-family:var(--fd);font-weight:600;font-size:2.4rem;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.pron{text-align:center;color:var(--mut);margin:6px 0;font-weight:700}
.mean{text-align:center;font-size:1.25rem;font-weight:800;color:var(--g);margin:4px 0 14px}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o{display:block;width:100%;text-align:left;min-height:56px;padding:13px 16px;border-radius:18px;background:#fff;border:2px solid var(--line);border-bottom-width:5px;font-size:1.03rem;font-weight:700;transition:transform .08s,background .2s,border-color .2s}
.o:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.o:disabled{opacity:1}
.o.sel{border-color:var(--sea);background:#EAF3FE}
.o.ok{border-color:var(--g);background:var(--okbg);color:#0E5A3A;animation:pop .35s}
.o.bad{border-color:var(--bad);background:var(--badbg);color:#932A2E;animation:shake .4s}
.o.gone{opacity:.25;pointer-events:none;transition:opacity .4s .25s}
.pic{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
.pe{font-size:2.6rem;line-height:1}
.mo{text-align:center}
.spk{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 20px}
.bigs{position:relative;width:100px;height:100px;border-radius:32px;background:var(--sea);color:#fff;font-size:2.3rem;box-shadow:0 6px 0 var(--sead)}
.bigs:active{transform:translateY(5px);box-shadow:none}
.bigs i{position:absolute;inset:0;border-radius:32px;border:3px solid var(--sea);animation:wave 2.2s infinite;pointer-events:none}.bigs i+i{animation-delay:1.1s}
.hint{color:var(--mut);font-size:.88rem;text-align:center;margin:8px 0}
.qlnk{display:block;margin:14px auto 0;color:var(--mut);font-weight:800;font-size:.85rem}
.ans{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;margin-bottom:20px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{padding:9px 14px;border-radius:14px;background:#fff;border:2px solid var(--line);border-bottom-width:4px;font-size:1rem;font-weight:700}
.chip.used{background:#E3EDE8;color:transparent;border-color:#E3EDE8;pointer-events:none}
.chip.new{animation:pop .3s}

KU-si","😅"],["Come stai?","¿Cómo estás?","KÓ-me STÁI","👍"],["Bene","Bien","BÉ-ne","😌"],["Sì","Sí","si","✅"]],"g":{"h":"Cómo suena el italiano","b":["Se lee casi como se escribe, igual que el español. Casi todas las palabras terminan en vocal.","'ci' y 'ce' suenan 'chi' y 'che': ciao = chao, arrivederci = arrivedérchi. En cambio 'chi' y 'che' suenan 'ki' y 'ke'.","'gn' suena como ñ: buongiorno = buonyórno. 'gli' suena parecido a 'lli': famiglia = famíllia.","Las consonantes dobles se pronuncian más largas y marcadas: notte = nót-te, cappuccino = kap-pu-chí-no.","'Ciao' es informal, entre amigos. Con desconocidos se usa 'Buongiorno' o 'Buonasera'."],"e":[["Ciao!","¡Hola! (informal)"],["Buongiorno, signora.","Buenos días, señora."],["Grazie mille!","¡Muchas gracias!"],["Prego.","De nada."]],"q":[["¿Cómo suena 'ci' en 'ciao'?",["Como 'si'","Como 'chi'","Como 'ki'"],1],["'gn' en 'buongiorno' suena como:",["ñ","g","n"],0],["Con un desconocido por la mañana dices:",["Ciao","Buongiorno","Buonanotte"],1]]},"s":[["Buongiorno, come stai?","Buenos días, ¿cómo estás?"],["Bene, grazie!","¡Bien, gracias!"],["Grazie mille!","¡Muchas gracias!"],["Per favore, scusi.","Por favor, disculpe."],["Ciao, buonasera!","Hola, ¡buenas tardes!"],["Arrivederci, buonanotte!","Adiós, ¡buenas noches!"]],"d":[["Giulia","Ciao! Come stai?","¡Hola! ¿Cómo estás?"],["Marco","Bene, grazie! E tu?","¡Bien, gracias! ¿Y tú?"],["Giulia","Bene! Arrivederci!","¡Bien! ¡Adiós!"],["Marco","Ciao, a domani!","¡Chao, hasta mañana!"]],"city":["Roma","🏛️",12.5,41.9,"La Ciudad Eterna, capital de Italia. En su Coliseo, inaugurado en el año 80, cabían decenas de miles de personas.",["Ciao, Roma!","¡Hola, Roma!"]]},{"t":"Presentarse con essere","w":[["Io","Yo","Í-o","🙋‍♂️"],["Tu","Tú","tu","🫵"],["Lui","Él","LÚ-i","👨"],["Lei","Ella / usted","LÉ-i","👩"],["Noi","Nosotros","NÓ-i","👫"],["Loro","Ellos","LÓ-ro","👥"],["Sono","Soy","SÓ-no","🪪"],["È","Es","e","🟰"],["Siamo","Somos","SIÁ-mo","🤝"],["Mi chiamo","Me llamo","mi KIÁ-mo","📛" ,"española","spa-ÑÓ-la","🇪🇸"],["Stati Uniti","Estados Unidos","STÁ-ti u-NÍ-ti","🇺🇸"]],"g":{"h":"Nacionalidades y 'di / dal / dalla'","b":["Las nacionalidades concuerdan: -o para hombre, -a para mujer: italiano → italiana.","Se escriben en minúscula: italiano, spagnolo. Los países, con mayúscula: Italia.","Para tu ciudad: Sono di + ciudad (Sono di Roma). Para el país se usa 'dal' o 'dalla': Vengo dalla Spagna, Vengo dal Messico.","Lo más fácil: Sono venezuelano = Soy venezolano. ¡Sirve en todas partes!"],"e":[["Sono venezuelano.","Soy venezolano."],["Lei è italiana.","Ella es italiana."],["Vengo dalla Spagna.","Vengo de España."],["Sono di Barquisimeto.","Soy de Barquisimeto."]],"q":[["Una mujer de Italia es:",["italiano","italiana","italiane"],1],["Las nacionalidades se escriben:",["con mayúscula","en minúscula"],1],["'Soy de Roma':",["Sono di Roma","Sono da Roma","Sono in Roma"],0]]},"s":[["Sono venezuelano.","Soy venezolano."],["Lei è italiana.","Ella es italiana."],["Lui è spagnolo.","Él es español."],["Vengo dal Venezuela.","Vengo de Venezuela."],["Noi siamo di Roma.","Somos de Roma."],["Vengo dalla Colombia.","Vengo de Colombia."]],"d":[["Giulia","Di dove sei?","¿De dónde eres?"],["Marco","Sono venezuelano. E tu?","Soy venezolano. ¿Y tú?"],["Giulia","Sono italiana, di Napoli.","Soy italiana, de Nápoles."],["Marco","Che bello!","¡Qué lindo!"]],"city":["Venezia","🛶",12.33,45.44,"Una ciudad sobre más de cien islas, sin carros: se recorre a pie o en barco. Por ella se llama así Venezuela: los exploradores vieron casas sobre el agua en el lago de Maracaibo y pensaron en una «pequeña Venecia».",["Venezia, non Venezuela!","¡Venecia, no Venezuela!"]]},{"t":"Números y artículos","w":[["Zero","Cero","DSÉ-ro","0️⃣"],["Uno","Uno","Ú-no","1️⃣"],["Due","Dos","DÚ-e","2️⃣"],["Tre","Tres","tre","3️⃣"],["Quattro","Cuatro","KUÁT-tro","4️⃣"],["Cinque","Cinco","CHÍN-kue","5️⃣"],["Sei","Seis","SÉ-i","6️⃣"],["Sette","Siete","SÉT-te","7️⃣"],["Otto","Ocho","ÓT-to","8️⃣"],["Nove","Nueve","NÓ-ve","9️⃣"],["Dieci","Diez","DIÉ-chi","🔟"],["Una","Una","Ú-na","1️⃣"]],"g":{"h":"Artículos: il, la, lo, l'","b":["Masculino: il libro (el libro). Se usa 'lo' con palabras que empiezan con s + consonante o con z: lo studente.","Femenino: la casa. Delante de vocal, ambos se vuelven l': l'amico, l'amica.","Indefinidos: un (un), una (una): un caffè, una pizza.","Plural: il → i, la → le: i libri, le case. Las palabras en -o hacen -i; las en -a hacen -e."],"e":[["un caffè, una pizza","un café, una pizza"],["il libro, i libri","el libro, los libros"],["la casa, le case","la casa, las casas"],["Sono le dieci.","Son las diez."]],"q":[["Plural de 'la casa':",["le case","la cases","i case"],0],["'Un café':",["una caffè","un caffè","uno caffè"],1],["¿Cómo se dice 'cinco'?",["cinque","cinco","sinque"],0]]},"s":[["Uno, due, tre.","Uno, dos, tres."],["Sono le dieci.","Son las diez."],["Un caffè, per favore.","Un café, por favor."],["Il mio numero è sette, otto, nove.","Mi número es siete, ocho, nueve."],["Quattro, cinque, sei.","Cuatro, cinco, seis."],["Una pizza e due caffè.","Una pizza y dos cafés."]],"d":[["Giulia","Qual è il tuo numero?","¿Cuál es tu número?"],["Marco","È tre, due, sette, otto.","Es tres, dos, siete, ocho."],["Giulia","Tre, due, sette, otto. Grazie!","Tres, dos, siete, ocho. ¡Gracias!"],["Marco","Prego!","¡De nada!"]],"city":["Firenze","🎨",11.25,43.77,"Cuna del Renacimiento. Aquí están el David de Miguel Ángel y la gran cúpula de Brunelleschi.",["Uno, due, tre… che bello!","Uno, dos, tres… ¡qué lindo!"]]},{"t":"Comida y pedir en un restaurante","w":[["Acqua","Agua","ÁK-kua","💧"],["Caffè","Café","kaf-FÉ","☕"],["Pane","Pan","PÁ-ne","🍞"],["Latte","Leche","LÁT-te","🥛"],["Pasta","Pasta","PÁS-ta","🍝"],["Pizza","Pizza","PÍT-tsa","🍕"],["Formaggio","Queso","for-MÁD-yo","🧀"],["Vino","Vino","VÍ-no","🍷"],["Vorrei","Quisiera","vor-RÉ-i","🙋"],["Con","Con","kon","➕"],["Senza","Sin","SÉN-tsa","➖"],["Il conto","La cuenta","il KÓN-to","🧾"]],"g":{"h":"Pedir con cortesía: vorrei","b":["'Vorrei' = quisiera. Es la forma más amable de pedir: Vorrei un caffè, per favore.","No lleva 'de' en medio: Vorrei acqua (nunca 'vorrei di acqua').","con = con, senza = sin: un caffè con latte, pasta senza formaggio.","Para pagar: Il conto, per favore. Ojo: en Italia 'latte' es solo leche; si pides 'un latte' te dan un vaso de leche."],"e":[["Vorrei un caffè, per favore.","Quisiera un café, por favor."],["Acqua senza gas.","Agua sin gas."],["Pane con formaggio.","Pan con queso."],["Il conto, per favore.","La cuenta, por favor."]],"q":[["Forma amable de pedir:",["Voglio caffè!","Vorrei un caffè","Caffè!"],1],["'Sin' en italiano:",["con","senza","sin"],1],["Si pides 'un latte' en Italia te dan:",["un café con leche","un vaso de leche","un té"],1]]},"s":[["Vorrei un caffè, per favore.","Quisiera un café, por favor."],["Un'acqua senza gas.","Un agua sin gas."],["Pane con formaggio.","Pan con queso."],["Il conto, per favore.","La cuenta, por favor."],["Vorrei una pizza.","Quisiera una pizza."],["Un vino, grazie.","Un vino, gracias."]],"d":[["Cameriere","Buonasera! Cosa desidera?","¡Buenas noches! ¿Qué desea?"],["Marco","Vorrei una pizza e un'acqua, per favore.","Quisiera una pizza y un agua, por favor."],["Cameriere","Con gas o senza gas?","¿Con gas o sin gas?"],["Marco","Senza gas, grazie. E il conto, per favore.","Sin gas, gracias. Y la cuenta, por favor."]],"city":["Napoli","🍕",14.27,40.85,"La cuna de la pizza. La Margherita, con los colores de la bandera italiana, es su receta más famosa.",["Vorrei una pizza, per favore!","¡Quisiera una pizza, por favor!"]]},{"t":"Estados y lugares: stare y essere","w":[["Sto bene","Estoy bien","sto BÉ-ne","😌"],["Sto male","Estoy mal","sto MÁ-le","🤒"],["Stanco","Cansado","STÁN-ko","😴"],["Felice","Feliz","fe-LÍ-che","😁"],["Qui","Aquí","kui","👇"],["Lì","Allí","li","👉"],["A casa","En casa","a KÁ-sa","🏠"],["Molto","Muy / mucho","MÓL-to","💯"],["Oggi","Hoy","ÓD-yi","📅"],["Dove","Dónde","DÓ-ve","❓"],["Al lavoro","En el trabajo","al la-VÓ-ro","💼"],["Così così","Más o menos","ko-SÍ ko-SÍ","🤷"]],"g":{"h":"Stare y essere: cómo estás y dónde estás","b":["Para decir cómo estás se usa 'stare': io sto · tu stai · lui/lei sta · noi stiamo · voi state · loro stanno.","Para decir dónde estás se usa 'essere': Sono a casa (estoy en casa), Marco è al lavoro.","'Sono stanco' (estoy cansado) y 'sono felice' también usan essere. 'Stare' va sobre todo con bene, male y così così.","'Molto' sirve para 'muy' y para 'mucho': molto stanco, molto caffè.","Dove sei? = ¿Dónde estás? Sono qui = Estoy aquí."],"e":[["Sto bene, grazie.","Estoy bien, gracias."],["Sono a casa.","Estoy en casa."],["Oggi sono molto stanco.","Hoy estoy muy cansado."],["Dove sei?","¿Dónde estás?"]],"q":[["'¿Cómo estás?' en italiano:",["Come sei?","Come stai?","Dove stai?"],1],["'Noi' + stare =",["stiamo","stanno","state"],0],["'Molto' significa:",["muy / mucho","poco","más"],0]]},"s":[["Sto bene, grazie.","Estoy bien, gracias."],["Come stai oggi?","¿Cómo estás hoy?"],["Sono molto stanco.","Estoy muy cansado."],["Lei è felice.","Ella está feliz."],["Noi siamo qui.","Estamos aquí."],["Marco è al lavoro.","Marco está en el trabajo."]],"d":[["Giulia","Ciao! Come stai?","¡Hola! ¿Cómo estás?"],["Marco","Così così. Sono molto stanco.","Más o menos. Estoy muy cansado."],["Giulia","Dove sei?","¿Dónde estás?"],["Marco","Sono ancora al lavoro. E tu?","Todavía estoy en el trabajo. ¿Y tú?"],["Giulia","Io sto bene, sono a casa.","Yo estoy bien, estoy en casa."]],"city":["Bologna","🍝",11.34,44.49,"Tiene la universidad más antigua del mundo occidental, fundada en 1088, y kilómetros de soportales para caminar bajo techo.",["Sto bene a Bologna!","¡Estoy bien en Bolonia!"]]},{"t":"Familia y posesivos","w":[["Famiglia","Familia","fa-MÍ-llia","👨‍👩‍👧"],["Madre","Madre","MÁ-dre","👩‍🍼"],["Padre","Padre","PÁ-dre","👨‍👧"],["Fratello","Hermano","fra-TÉL-lo","👦"],["Sorella","Hermana","so-RÉL-la","👧"],["Figlio","Hijo","FÍ-llo","👶"],["Figlia","Hija","FÍ-lla","🧒"],["Amico","Amigo","a-MÍ-ko","🧑‍🤝‍🧑"],["Nonno","Abuelo","NÓN-no","👴"],["Nonna","Abuela","NÓN-na","👵"],["Mio","Mi (masculino)","MÍ-o","☝️"],["Mia","Mi (femenino)","MÍ-a","💁‍♀️"]],"g":{"h":"Posesivos con artículo","b":["mio/mia (mi), tuo/tua (tu), suo/sua (su), nostro/nostra (nuestro). Concuerdan con la cosa poseída: il mio libro, la mia casa.","En italiano el posesivo normalmente lleva artículo: il mio amico, la mia casa.","Excepción: con familiares en singular no se usa artículo: mio padre, mia madre, mio fratello. En plural sí: i miei fratelli.","'Genitori' significa 'padres' (mamá y papá); 'parenti' son los parientes."],"e":[["mio padre, mia madre","mi padre, mi madre"],["il mio amico","mi amigo"],["i miei fratelli","mis hermanos"],["Lei è mia sorella.","Ella es mi hermana."]],"q":[["'Mi madre':",["la mia madre","mia madre","mio madre"],1],["Plural de 'mio fratello':",["i miei fratelli","miei fratelli","i mii fratelli"],0],["'Genitori' significa:",["parientes","padres (mamá y papá)","abuelos"],1]]},"s":[["Questa è la mia famiglia.","Esta es mi familia."],["Mio padre è italiano.","Mi padre es italiano."],["Mia madre è a casa.","Mi madre está en casa."],["Lei è mia sorella.","Ella es mi hermana."],["Lui è il mio amico.","Él es mi amigo."],["Mio nonno è molto felice.","Mi abuelo está muy feliz."]],"d":[["Giulia","Questa è la mia famiglia.","Esta es mi familia."],["Marco","Che bella! Chi è lui?","¡Qué linda! ¿Quién es él?"],["Giulia","È mio padre. E lei è mia madre.","Es mi padre. Y ella es mi madre."],["Marco","E loro?","¿Y ellos?"],["Giulia","Sono i miei nonni.","Son mis abuelos."]],"city":["Pisa","🗼",10.4,43.72,"Su torre empezó a inclinarse mientras la construían, en el siglo XII. Galileo Galilei nació en esta ciudad.",["Questa è la mia famiglia a Pisa!","¡Esta es mi familia en Pisa!"]]},{"t":"Verbos en -are y hablar de ti","w":[["Parlare","Hablar","par-LÁ-re","🗣️"],["Abitare","Vivir (residir)","a-bi-TÁ-re","🏡"],["Lavorare","Trabajar","la-vo-RÁ-re","💼"],["Studiare","Estudiar","stu-DIÁ-re","📚"],["Mangiare","Comer","man-YÁ-re","🍽️"],["Inglese","Inglés","in-GLÉ-se","🇬🇧"],["Città","Ciudad","chit-TÁ","🏙️"],["Anche","También","ÁN-ke","🔁"],["Non","No","non","🚫"],["Un po'","Un poco","un PÓ","🤏"],["Piano","Despacio","PIÁ-no","🐢"],["Mi piace","Me gusta","mi PIÁ-che","❤️"]],"g":{"h":"Presente de los verbos en -are","b":["parlare: io parlo · tu parli · lui/lei parla · noi parliamo · voi parlate · loro parlano. Quita -are y pon -o, -i, -a, -iamo, -ate, -ano.","Mismo patrón: abitare (abito), lavorare (lavoro), studiare (studio), mangiare (mangio).","La negación va antes del verbo: Non parlo inglese.","'Mi piace' = me gusta, igual que en español: Mi piace la pizza. En plural: Mi piacciono i libri.","Para pedir: Parla piano, per favore (habla despacio, por favor)."],"e":[["Parlo un po' di italiano.","Hablo un poco de italiano."],["Abito a Barquisimeto.","Vivo en Barquisimeto."],["Non parlo inglese.","No hablo inglés."],["Mi piace la pizza.","Me gusta la pizza."]],"q":[["'Yo hablo':",["io parla","io parlo","io parli"],1],["'No hablo inglés':",["Parlo non inglese","Non parlo inglese","No parlo inglese"],1],["'Me gusta la pizza':",["Mi piace la pizza","Io piaccio la pizza","Mi piacciono la pizza"],0]]},"s":[["Parlo un po' di italiano.","Hablo un poco de italiano."],["Abito in una città grande.","Vivo en una ciudad grande."],["Lei lavora qui.","Ella trabaja aquí."],["Noi studiamo italiano.","Estudiamos italiano."],["Non parlo inglese.","No hablo inglés."],["Parla piano, per favore.","Habla despacio, por favor."]],"d":[["Giulia","Parli inglese?","¿Hablas inglés?"],["Marco","Sì, e parlo anche un po' di spagnolo.","Sí, y también hablo un poco de español."],["Giulia","Bravo! Dove abiti?","¡Bravo! ¿Dónde vives?"],["Marco","Abito a Milano e lavoro molto.","Vivo en Milán y trabajo mucho."]],"city":["Torino","🚗",7.69,45.07,"Fue la primera capital de la Italia unida, en 1861. Aquí nació la Fiat y en su catedral se guarda la Sábana Santa.",["Abito a Torino!","¡Vivo en Turín!"]]},{"t":"Días de la semana","w":[["Lunedì","Lunes","lu-ne-DÍ","📅"],["Martedì","Martes","mar-te-DÍ","📅"],["Mercoledì","Miércoles","mer-ko-le-DÍ","📅"],["Giovedì","Jueves","yo-ve-DÍ","📅"],["Venerdì","Viernes","ve-ner-DÍ","🎊"],["Sabato","Sábado","SÁ-ba-to","🎉"],["Domenica","Domingo","do-MÉ-ni-ka","⛪"],["Domani","Mañana (el día siguiente)","do-MÁ-ni","⏭️"],["Ieri","Ayer","IÉ-ri","⏮️"],["Settimana","Semana","set-ti-MÁ-na","🗓️"],["Adesso","Ahora","a-DÉS-so","⏰"],["Sempre","Siempre","SÉM-pre","♾️"]],"g":{"h":"Los días y 'il lunedì'","b":["Los días se escriben en minúscula: lunedì, martedì… Todos son masculinos menos 'la domenica'.","Para 'el lunes' (este lunes) se dice solo 'lunedì': Lunedì lavoro.","Para 'los lunes' (cada lunes) se usa el artículo: Il lunedì lavoro = Los lunes trabajo.","Despedidas útiles: A domani! (¡hasta mañana!), A lunedì! (¡hasta el lunes!)."],"e":[["Oggi è sabato.","Hoy es sábado."],["Domani è domenica.","Mañana es domingo."],["Il lunedì lavoro.","Los lunes trabajo."],["A domani!","¡Hasta mañana!"]],"q":[["Los días en italiano se escriben:",["con mayúscula","en minúscula"],1],["'Los lunes trabajo':",["Lunedì lavoro","Il lunedì lavoro","La lunedì lavoro"],1],["El único día femenino es:",["sabato","domenica","lunedì"],1]]},"s":[["Oggi è sabato.","Hoy es sábado."],["Domani è domenica.","Mañana es domingo."],["Il lunedì lavoro.","Los lunes trabajo."],["Adesso sono qui.","Ahora estoy aquí."],["A domani!","¡Hasta mañana!"],["Studio sempre il mercoledì.","Siempre estudio los miércoles."]],"d":[["Giulia","Che giorno è oggi?","¿Qué día es hoy?"],["Marco","Oggi è mercoledì.","Hoy es miércoles."],["Giulia","E domani?","¿Y mañana?"],["Marco","Domani è giovedì.","Mañana es jueves."],["Giulia","Allora a domani!","¡Entonces hasta mañana!"]],"city":["Verona","💕",10.99,45.44,"La ciudad de Romeo y Julieta. Su gran anfiteatro romano, la Arena, todavía se usa para óperas en verano.",["A domani, Verona!","¡Hasta mañana, Verona!"]]},{"t":"La ciudad y las direcciones","w":[["Dov'è","¿Dónde está?","do-VÉ","📍"],["A destra","A la derecha","a DÉS-tra","➡️"],["A sinistra","A la izquierda","a si-NÍS-tra","⬅️"],["Dritto","Derecho / recto","DRÍT-to","⬆️"],["Vicino","Cerca","vi-CHÍ-no","🤏"],["Lontano","Lejos","lon-TÁ-no","🔭"],["Via","Calle","VÍ-a","🛣️"],["Banca","Banco","BÁN-ka","🏦"],["Farmacia","Farmacia","far-ma-CHÍ-a","💊"],["Stazione","Estación","sta-TSIÓ-ne","🚉"],["Giri","Gire","YÍ-ri","↪️"],["Vada","Vaya / siga","VÁ-da","🚶‍♂️"]],"g":{"h":"Preguntar el camino","b":["Dov'è…? = ¿Dónde está…? Es 'dove' + 'è' unidos: Dov'è la stazione?","Las preposiciones se unen con el artículo: a + la = alla, di + il = del: vicino alla banca, vicino al bar.","Instrucciones con 'Lei' (usted): Vada dritto (siga derecho), Giri a destra (gire a la derecha).","Para llamar la atención con cortesía: Scusi! o Mi scusi!"],"e":[["Scusi, dov'è la stazione?","Disculpe, ¿dónde está la estación?"],["La farmacia è vicino alla banca.","La farmacia está cerca del banco."],["Giri a sinistra.","Gire a la izquierda."],["Vada dritto.","Siga derecho."]],"q":[["'Dov'è' significa:",["¿dónde está?","¿qué es?","¿cuándo es?"],0],["a + la =",["alla","ala","al"],0],["'Gire a la derecha':",["Giri a destra","Giri a sinistra","Vada dritto"],0]]},"s":[["Dov'è la banca?","¿Dónde está el banco?"],["La stazione è lontano.","La estación está lejos."],["La farmacia è a destra.","La farmacia está a la derecha."],["Vada dritto.","Siga derecho."],["Giri a sinistra.","Gire a la izquierda."],["Scusi, dov'è via Roma?","Disculpe, ¿dónde está la calle Roma?"]],"d":[["Marco","Scusi, dov'è la farmacia?","Disculpe, ¿dónde está la farmacia?"],["Giulia","È vicino. Vada dritto.","Está cerca. Siga derecho."],["Giulia","Poi giri a destra.","Luego gire a la derecha."],["Marco","Grazie mille!","¡Muchas gracias!"],["Giulia","Prego!","¡De nada!"]],"city":["Assisi","⛪",12.62,43.07,"La ciudad de San Francisco de Asís. Su basílica, con frescos de Giotto, es Patrimonio de la Humanidad.",["Scusi, dov'è la basilica?","Disculpe, ¿dónde está la basílica?"]]}]},"fr":{"units":[{"t":"Saludos y cortesía","w":[["Bonjour","Buenos días / Hola","bon-ZHUR","🌅"],["Salut","Hola (informal)","sa-LÜ","👋"],["Bonsoir","Buenas noches (al llegar)","bon-SUAR","🌇"],["Bonne nuit","Buenas noches (al dormir)","bon NUÍ","🌙"],["Au revoir","Adiós","o re-VUAR","🚶"],["Merci","Gracias","mer-SÍ","🙏"],["De rien","De nada","de RIÉN","😊"],["S'il vous plaît","Por favor","sil vu PLE","🤲"],["Pardon","Perdón","par-DÓN","😅"],["Ça va?","¿Qué tal?","sa VA","👍"],["Bien","Bien","biÉN","😌"],["Oui","Sí","ui","✅"]],"g":{"h":"Cómo suena el francés","b":["Muchas letras finales no se pronuncian: la -s, la -t y la -d del final casi siempre son mudas: salut = salü, beaucoup = bokú.","'ou' suena 'u': bonjour = bonzhúr. 'oi' suena 'ua': au revoir = o revuár.","La 'u' francesa no existe en español: pon la boca para decir 'u' y di 'i'. En la pronunciación la escribimos ü.","'on', 'an', 'en' y 'in' son nasales: el aire sale por la nariz y la n casi no suena: bonjour, bien.","'Salut' es entre amigos. Con desconocidos: 'Bonjour' de día y 'Bonsoir' de noche."],"e":[["Bonjour, madame.","Buenos días, señora."],["Merci beaucoup!","¡Muchas gracias!"],["Ça va bien.","Me va bien."],["Au revoir!","¡Adiós!"]],"q":[["'oi' en 'au revoir' suena:",["oi","ua","o"],1],["Con un desconocido en la mañana dices:",["Salut","Bonjour","Bonne nuit"],1],["La -t final de 'salut':",["se pronuncia","no se pronuncia"],1]]},"s":[["Bonjour, ça va?","Hola, ¿qué tal?"],["Ça va bien, merci!","¡Bien, gracias!"],["Merci beaucoup!","¡Muchas gracias!"],["Pardon, s'il vous plaît.","Perdón, por favor."],["Bonsoir, madame!","¡Buenas noches, señora!"],["Au revoir, bonne nuit!","Adiós, ¡buenas noches!"]],"d":[["Claire","Bonjour! Ça va?","¡Hola! ¿Qué tal?"],["Lucas","Ça va bien, merci! Et toi?","¡Bien, gracias! ¿Y tú?"],["Claire","Très bien! Au revoir!","¡Muy bien! ¡Adiós!"],["Lucas","Au revoir, à demain!","¡Adiós, hasta mañana!"]],"city":["Paris","🗼",2.35,48.86,"La T a!"],["J'étudie toujours le mercredi.","Siempre estudio los miércoles."]],"d":[["Claire","On est quel jour aujourd'hui?","¿Qué día es hoy?"],["Lucas","Aujourd'hui, c'est mercredi.","Hoy es miércoles."],["Claire","Et demain?","¿Y mañana?"],["Lucas","Demain, c'est jeudi.","Mañana es jueves."],["Claire","Alors, à demain!","¡Entonces, hasta mañana!"]],"city":["Mont-Saint-Michel","🏝️",-1.51,48.64,"Una abadía sobre un islote rocoso. Con la marea alta queda rodeada de agua; es una de las visitas más famosas de Francia.",["Samedi au Mont-Saint-Michel!","¡El sábado en el Mont-Saint-Michel!"]]},{"t":"La ciudad y las direcciones","w":[["Où est","¿Dónde está?","u E","📍"],["À droite","A la derecha","a DRUAT","➡️"],["À gauche","A la izquierda","a GOSH","⬅️"],["Tout droit","Todo recto","tu DRUÁ","⬆️"],["Près","Cerca","PRE","🤏"],["Loin","Lejos","LUÁN","🔭"],["Rue","Calle","rü","🛣️"],["Banque","Banco","BANK","🏦"],["Pharmacie","Farmacia","far-ma-SÍ","💊"],["Gare","Estación de tren","GAR","🚉"],["Tournez","Gire","tur-NÉ","↪️"],["Allez","Vaya / siga","a-LÉ","🚶‍♂️"]],"g":{"h":"Preguntar el camino","b":["Où est…? = ¿Dónde está…? Où est la gare?","à + le = au, à + les = aux, de + le = du: près de la banque, à côté du café.","Instrucciones con 'vous': Allez tout droit (siga recto), Tournez à gauche (gire a la izquierda).","Para llamar la atención con cortesía: Excusez-moi! o Pardon, monsieur / madame."],"e":[["Excusez-moi, où est la gare?","Disculpe, ¿dónde está la estación?"],["La pharmacie est près de la banque.","La farmacia está cerca del banco."],["Tournez à gauche.","Gire a la izquierda."],["Allez tout droit.","Siga recto."]],"q":[["'Où est' significa:",["¿dónde está?","¿qué es?","¿cuándo es?"],0],["de + le =",["du","de le","des"],0],["'Gire a la derecha':",["Tournez à droite","Tournez à gauche","Allez tout droit"],0]]},"s":[["Où est la banque?","¿Dónde está el banco?"],["La gare est loin.","La estación está lejos."],["La pharmacie est à droite.","La farmacia está a la derecha."],["Allez tout droit.","Siga recto."],["Tournez à gauche.","Gire a la izquierda."],["Pardon, où est la rue Victor Hugo?","Perdón, ¿dónde está la calle Victor Hugo?"]],"d":[["Lucas","Excusez-moi, où est la pharmacie?","Disculpe, ¿dónde está la farmacia?"],["Claire","C'est près d'ici. Allez tout droit.","Está cerca de aquí. Siga recto."],["Claire","Puis tournez à droite.","Luego gire a la derecha."],["Lucas","Merci beaucoup!","¡Muchas gracias!"],["Claire","De rien!","¡De nada!"]],"city":["Reims","🥂",4.03,49.25,"En su catedral se coronaba a los reyes de Francia. También es la capital del champán.",["Pardon, où est la cathédrale?","Perdón, ¿dónde está la catedral?"]]}]},"de":{"units":[{"t":"Saludos y cortesía","w":[["Hallo","Hola","JÁ-lo","👋"],["Guten Morgen","Buenos días","GU-ten MÓR-guen","🌅"],["Guten Tag","Buen día / Buenas tardes","GU-ten TAK","☀️"],["Guten Abend","Buenas noches (al llegar)","GU-ten Á-bent","🌇"],["Gute Nacht","Buenas noches (al dormir)","GU-te NAJT","🌙"],["Tschüss","Chao","CHÜS","🤙"],["Auf Wiedersehen","Adiós","auf VÍ-der-se-en","🚶"],["Danke","Gracias","DÁN-ke","🙏"],["Bitte","Por favor / De nada","BÍ-te","🤲"],["Entschuldigung","Disculpe","ent-SHÚL-di-gung","😅"],["Wie geht's?","¿Qué tal?","vi GUETS","👍"],["Gut","Bien","gut","😌"]],"g":{"h":"Cómo suena el alemán","b":["Todos los sustantivos se escriben con mayúscula: der Morgen, die Nacht, der Tag.","'w' suena como 'v': Wiedersehen = vídersen. Y la 'v' suele sonar como 'f': Vater = fáter.","'ch' después de a, o, u suena como la j española: Nacht = najt. 'sch' suena 'sh': Tschüss = chüs.","'ei' suena 'ai' e 'ie' suena 'i': nein = nain, wie = vi. La 'ü' es como la 'u' francesa: labios de 'u' diciendo 'i'.","'Bitte' sirve para 'por favor' y para 'de nada'. Muy útil."],"e":[["Guten Morgen!","¡Buenos días!"],["Danke schön!","¡Muchas gracias!"],["Bitte schön!","¡De nada!"],["Auf Wiedersehen!","¡Adiós!"]],"q":[["La 'w' en alemán suena como:",["w inglesa","v","u"],1],["'Bitte' significa:",["gracias","por favor y de na ["Eins, zwei, drei.","Uno, dos, tres."],["Es ist zehn Uhr.","Son las diez."],["Ein Kaffee, bitte.","Un café, por favor."],["Meine Nummer ist sieben, acht, neun.","Mi número es siete, ocho, nueve."],["Vier, fünf, sechs.","Cuatro, cinco, seis."],["Eine Pizza und zwei Kaffee.","Una pizza y dos cafés."]],"d":[["Anna","Wie ist deine Nummer?","¿Cuál es tu número?"],["Lukas","Drei, zwei, sieben, acht.","Tres, dos, siete, ocho."],["Anna","Drei, zwei, sieben, acht. Danke!","Tres, dos, siete, ocho. ¡Gracias!"],["Lukas","Bitte!","¡De nada!"]],"city":["Frankfurt","💶",8.68,50.11,"El centro financiero de Europa: aquí están el Banco Central Europeo y la Bolsa de Fráncfort.",["Eins, zwei, drei… Börse!","Uno, dos, tres… ¡bolsa!"]]},{"t":"Comida y pedir en un restaurante","w":[["Wasser","Agua","VÁ-ser","💧"],["Kaffee","Café","ka-FÉ","☕"],["Brot","Pan","BROT","🍞"],["Milch","Leche","milj","🥛"],["Käse","Queso","KÉ-se","🧀"],["Bier","Cerveza","BIR","🍺"],["Wurst","Salchicha","VURST","🌭"],["Apfel","Manzana","ÁP-fel","🍎"],["Ich möchte","Quisiera","ij MÖJ-te","🙋"],["Mit","Con","mit","➕"],["Ohne","Sin","Ó-ne","➖"],["Die Rechnung","La cuenta","di RÉJ-nung","🧾"]],"g":{"h":"Pedir con cortesía: ich möchte","b":["'Ich möchte' = quisiera. Es la forma amable: Ich möchte einen Kaffee, bitte.","mit = con, ohne = sin: Kaffee mit Milch, Wasser ohne Kohlensäure (agua sin gas).","Para pagar: Die Rechnung, bitte. Más informal: Zahlen, bitte!","El pan es casi sagrado en Alemania: hay cientos de tipos distintos."],"e":[["Ich möchte einen Kaffee, bitte.","Quisiera un café, por favor."],["Kaffee mit Milch.","Café con leche."],["Brot mit Käse.","Pan con queso."],["Die Rechnung, bitte.","La cuenta, por favor."]],"q":[["Forma amable de pedir:",["Ich will Kaffee!","Ich möchte einen Kaffee","Kaffee!"],1],["'Sin' en alemán:",["mit","ohne","sin"],1],["Para pedir la cuenta:",["Die Rechnung, bitte","Danke schön","Guten Tag"],0]]},"s":[["Ich möchte einen Kaffee, bitte.","Quisiera un café, por favor."],["Kaffee mit Milch." go: Ich lerne gern Deutsch (me gusta aprender alemán)."],"e":[["Ich spreche ein bisschen Deutsch.","Hablo un poco de alemán."],["Ich wohne in Barquisimeto.","Vivo en Barquisimeto."],["Ich spreche kein Englisch.","No hablo inglés."],["Ich esse gern Pizza.","Me gusta comer pizza."]],"q":[["'Tú hablas':",["du sprechst","du sprichst","du spricht"],1],["'No vivo aquí':",["Ich nicht wohne hier","Ich wohne nicht hier","Ich wohne kein hier"],1],["'Me gusta aprender alemán':",["Ich lerne gern Deutsch","Ich gern lerne Deutsch","Ich lerne Deutsch kein"],0]]},"s":[["Ich spreche ein bisschen Deutsch.","Hablo un poco de alemán."],["Ich wohne in einer großen Stadt.","Vivo en una ciudad grande."],["Sie arbeitet hier.","Ella trabaja aquí."],["Wir lernen Deutsch.","Aprendemos alemán."],["Ich wohne nicht hier.","No vivo aquí."],["Sprechen Sie bitte langsam.","Hable despacio, por favor."]],"d":[["Anna","Sprichst du Englisch?","¿Hablas inglés?"],["Lukas","Ja, und ich spreche auch ein bisschen Spanisch.","Sí, y también hablo un poco de español."],["Anna","Super! Wo wohnst du?","¡Súper! ¿Dónde vives?"],["Lukas","Ich wohne in Köln und arbeite viel.","Vivo en Colonia y trabajo mucho."]],"city":["Bonn","🎹",7.1,50.73,"Aquí nació Beethoven en 1770. Fue la capital de Alemania Occidental hasta la reunificación.",["Ich lerne gern Deutsch!","¡Me gusta aprender alemán!"]]},{"t":"Días de la semana","w":[["Montag","Lunes","MÓN-tak","📅"],["Dienstag","Martes","DÍNS-tak","📅"],["Mittwoch","Miércoles","MÍT-voj","📅"],["Donnerstag","Jueves","DÓ-ners-tak","📅"],["Freitag","Viernes","FRÁI-tak","🎊"],["Samstag","Sábado","SÁMS-tak","🎉"],["Sonntag","Domingo","SÓN-tak","⛪"],["morgen","Mañana (el día siguiente)","MÓR-guen","⏭️"],["Gestern","Ayer","GUÉS-tern","⏮️"],["Woche","Semana","VÓ-je","🗓️"],["Jetzt","Ahora","YETST","⏰"],["Immer","Siempre","Í-mer","♾️"]],"g":{"h":"Los días y 'am Montag'","b":["Los días son masculinos (der Montag) y, como todo sustantivo, van con mayúscula.","'El lunes' = am Montag: Am Montag arbeite ich.","'Los lunes' (cada lunes) = montags, en minúscula: Montags arbeite ich.","Si la frase empieza con el tiempo, el verbo va en segundo lugar: Heute arbeite ich. Despedida útil: Bis morgen! (¡hasta mañana!)."],"e":[["Heute ist Samstag.","Hoy es sábado."],["Morgen ist Sonntag.","Mañana es domingo."],["Am Montag arbeite ich.","El lunes trabajo."],["Bis morgen!","¡Hasta mañana!"]],"q":[["'El lunes trabajo':",["Am Montag arbeite ich","Am Montag ich arbeite","Der Montag arbeite ich"],0],["'Los lunes' (cada lunes):",["montags","am Montags","Montag"],0],["'¡Hasta mañana!':",["Bis morgen!","Bis gestern!","Gute Morgen!"],0]]},"s":[["Heute ist Samstag.","Hoy es sábado."],["Morgen ist Sonntag.","Mañana es domingo."],["Am Montag arbeite ich.","El lunes trabajo."],["Jetzt bin ich hier.","Ahora estoy aquí."],["Bis morgen!","¡Hasta mañana!"],["Ich lerne immer am Mittwoch.","Siempre estudio los miércoles."]],"d":[["Anna","Welcher Tag ist heute?","¿Qué día es hoy?"],["Lukas","Heute ist Mittwoch.","Hoy es miércoles."],["Anna","Und morgen?","¿Y mañana?"],["Lukas","Morgen ist Donnerstag.","Mañana es jueves."],["Anna","Also, bis morgen!","¡Entonces, hasta mañana!"]],"city":["Nürnberg","🎄",11.08,49.45,"Famosa por su mercado de Navidad, uno de los más antiguos de Alemania, y por sus salchichas pequeñitas.",["Bis morgen, Nürnberg!","¡Hasta mañana, Núremberg!"]]},{"t":"La ciudad y las direcciones","w":[["Wo ist","¿Dónde está?","vo IST","📍"],["Rechts","A la derecha","REJTS","➡️"],["Links","A la izquierda","LINKS","⬅️"],["Geradeaus","Todo recto","gue-ra-de-ÁUS","⬆️"],["Nah","Cerca","NA","🤏"],["Weit","Lejos","VAIT","🔭"],["Straße","Calle","SHTRÁ-se","🛣️"],["Bank","Banco","BANK","🏦"],["Apotheke","Farmacia","a-po-TÉ-ke","💊"],["Bahnhof","Estación de tren","BAN-hof","🚉"],["Biegen Sie ab","Gire","BÍ-guen si ab","↪️"],["Gehen Sie","Vaya / siga","GUÉ-en si","🚶‍♂️"]],"g":{"h":"Preguntar el camino","b":["Wo ist…? = ¿Dónde está…? Wo ist der Bahnhof?","rechts = a la derecha, links = a la izquierda,   if(s.dataset.w===b.dataset.w){tone(1);[s,b].forEach(x=>x.classList.add('ok','gone'));if(--G.left==0){G.done=1;clearInterval(G.tv);const t=Math.round((Date.now()-G.t0)/1000);setTimeout(()=>gameEnd('parejas',t,1),500)}}
  else{tone(0);[s,b].forEach(x=>{x.classList.add('bad');setTimeout(()=>x.classList.remove('bad'),450)})}})}
function timer(ms,id){G.end=Date.now()+ms;G.ms=ms;G.tv=setInterval(()=>{const r=G.end-Date.now(),b=$('#tbar');if(b)b.style.width=Math.max(0,r/G.ms*100)+'%';if(r<=0&&!G.done){clearInterval(G.tv);gameEnd(id,G.sc)}},100)}
const tw=()=>G.end?Math.max(0,(G.end-Date.now())/G.ms*100):100;
function gReloj(){openOv('game');G={sc:0,pool:gpool()};relojQ();timer(60000,'reloj')}
function relojQ(){if(G.done)return;const w=pick(G.pool),o=sh([w].concat(dis(w,G.pool,2)));G.lock=0;
 setLb(`<div class="tbar"><i id="tbar" style="width:${tw()}%"></i></div><div class="gsc">⚡ ${G.sc}</div><div class="pw" style="margin:26px 0">${esc(w[0])}</div><div class="col">${o.map((x,k)=>`<button class="o" data-k="${k}">${esc(x[1])}</button>`).join('')}</div>`);
 const bs=$('#lb').querySelectorAll('.o');bs.forEach(b=>b.onclick=()=>{if(G.lock||G.done)return;G.lock=1;const ok=o[+b.dataset.k]===w;b.classList.add(ok?'ok':'bad');if(!ok)bs[o.indexOf(w)].classList.add('ok');tone(ok);if(ok)G.sc++;srs(w[0],ok);setTimeout(relojQ,ok?260:800)})}
function gEscucha(){if(isQuiet())return toast('🔇','Modo público activo','Este juego necesita audio');openOv('game');G={sc:0,n:0,pool:gpool()};escQ()}
function escQ(){if(G.done)return;if(G.n>=10)return gameEnd('escucha',G.sc);G.lock=0;const w=pick(G.pool),o=sh([w].concat(dis(w,G.pool,3)));G.n++;G.w=w;
 setLb(`<div class="tag">🎧 Ronda ${G.n} de 10 · aciertos ${G.sc}</div><div class="spk"><button class="bigs" onclick="say(G.w[0])">🔊<i></i><i></i></button><button class="ic" onclick="say(G.w[0],.5)">🐢</button></div><div class="grid2">${o.map((x,k)=>`<button class="o pic" data-k="${k}"><span class="pe">${em(x)}</span><span>${esc(x[1])}</span></button>`).join('')}</div>`);
 setTimeout(()=>say(w[0]),300);
 const bs=$('#lb').querySelectorAll('.o');bs.forEach(b=>b.onclick=()=>{if(G.lock)return;G.lock=1;const ok=o[+b.dataset.k]===w;b.classList.add(ok?'ok':'bad');if(!ok)bs[o.indexOf(w)].classList.add('ok');tone(ok);if(ok)G.sc++;srs(w[0],ok);setTimeout(escQ,ok?700:1300)})}
function gVF(){openOv('game');G={sc:0,pool:gpool()};vfQ();timer(45000,'vf')}
function vfQ(){if(G.done)return;G.lock=0;const w=pick(G.pool),tr=Math.random()<.5,m=tr?w:(dis(w,G.pool,1)[0]||w),ans=m===w;
 setLb(`<div class="tbar"><i id="tbar" style="width:${tw()}%"></i></div><div class="gsc">✓ ${G.sc}</div><div class="vfc" id="vfc"><div class="pw">${esc(w[0])}</div><div class="eq">=</div><div class="vfe">${em(m)} ${esc(m[1])}</div><div class="small mut" id="vfn" style="margin-top:8px">&nbsp;</div></div><div class="row"><button class="btn red" id="vn">✗ Mentira</button><button class="btn" id="vy">✓ Verdad</button></div>`);
 const go=a=>{if(G.lock||G.done)return;G.lock=1;const ok=a===ans;tone(ok);if(ok)G.sc++;const c=$('#vfc');if(!ok)$('#vfn').textContent=w[0]+' = '+w[1];setTimeout(()=>c.classList.add(a?'flyR':'flyL'),ok?0:600);setTimeout(vfQ,ok?330:950)};
 $('#vy').onclick=()=>go(true);$('#vn').onclick=()=>go(false)}
function gSonidos(){if(isQuiet())return toast('🔇','Modo público activo','Este juego necesita audio');openOv('game');G={sc:0,n:0,ps:sh(PAIRS)};sonQ()}
function sonQ(){if(G.done)return;if(G.n>=10)return gameEnd('sonidos',G.sc);G.lock=0;const p=G.ps[G.n%G.ps.length],t=Math.random()<.5?0:1;G.n++;G.t=p[t];const o=sh([0,1]);
 setLb(`<div class="tag">👂 Ronda ${G.n} de 10 · aciertos ${G.sc}</div><p class="mut" style="text-align:center">¿Cuál de las dos oíste?</p><div class="spk"><button class="bigs" onclick="say(G.t[0],.75)">🔊<i></i><i></i></button><button class="ic" onclick="say(G.t[0],.5)">🐢</button></div><div class="grid2">${o.map(k=>`<button class="o pic" data-k="${k}"><span class="pw" style="font-size:1.8rem">${esc(p[k][0])}</span><span class="mut">${esc(p[k][1])}</span></button>`).join('')}</div><div id="sn"></div>`);
 setTimeout(()=>say(G.t[0],.75),300);
 const bs=$('#lb').querySelectorAll('.o');bs.forEach(b=>b.onclick=()=>{if(G.lock)return;G.lock=1;const ok=+b.dataset.k===t;bs.forEach(x=>{if(+x.dataset.k===t)x.classList.add('ok')});if(!ok)b.classList.add('bad');tone(ok);if(ok)G.sc++;
  $('#sn').innerHTML=`<div class="row c" style="margin-top:16px"><button class="btn ghost" onclick="say('${esc(p[0][0])}',.7)">🔊 ${esc(p[0][0])}</button><button class="btn ghost" onclick="say('${esc(p[1][0])}',.7)">🔊 ${esc(p[1][0])}</button></div><button class="btn w" onclick="sonQ()">Siguiente</button>`})}
function gHabla(){if(isQuiet())return toast('🔇','Modo público activo','Desactívalo en Yo para hablar');openOv('game');const u=curUnit();let pool=[];for(let k=0;k<=u;k++)pool=pool.concat(L[k].s);G={ss:sh(pool).slice(0,6),i:0};hablaQ()}
function hablaQ(){if(G.i>=G.ss.length){track();S.n.games++;save();setLb(endHTML('¡Bien hablado!','Practicaste '+G.ss.length+' frases en voz alta',[[G.ss.length,'frases'],[fmt(Date.now()-Q.t0),'tiempo'],['🗣️','pronunciación']],'',1));$('#ft').innerHTML=`<div class="row" style="margin:0"><button class="btn ghost" onclick="closeOv()">Salir</button><button class="btn" onclick="gHabla()">Otra vez</button></div>`;confetti();checkBadges();return}
 const s=G.ss[G.i];
 setLb(`<div class="tag">🎙️ Frase ${G.i+1} de ${G.ss.length} · escucha y repite</div><div class="pager slide" style="text-align:center"><div class="qq sm" style="margin:0">${esc(s[0])}</div><p class="mut" style="font-size:1rem">${esc(s[1])}</p></div><div class="row c"><button class="ic" onclick="say(G.ss[G.i][0])">🔊</button><button class="ic" onclick="say(G.ss[G.i][0],.55)">🐢</button><button class="ic" onclick="mic(G.ss[G.i][0])">🎤</button></div><div id="heard" class="hint">Repite con el mismo ritmo. ${esc(X.htip)}</div>`);
 $('#ft').innerHTML=`<button class="btn w" onclick="G.i++;hablaQ()">Lo dije ✓</button>`;setTimeout(()=>say(s[0]),250)}
/* Manos libres */
function gManos(){if(isQuiet())return toast('🔇','Modo público activo','Desactívalo en Yo para escuchar');openOv('game');const lw=learned(),u=curUnit();let ss=[];for(let k=0;k<=u;k++)ss=ss.concat(L[k].s);
 const items=sh((lw.length?lw:L[0].w).map(w=>[w[0],w[1],em(w)])).slice(0,14).concat(sh(ss).slice(0,6).map(s=>[s[0],s[1],'💬']));G={it:sh(items),i:0,play:1,stop:0};
 manosUI();manosRun()}
function manosUI(){const it=G.it[G.i%G.it.length];setLb(`<div class="tag">🚗 Manos libres · escucha, repite y sigue</div><div class="hf"><div class="emo sm pop">${it[2]}</div><div class="pw">${esc(it[0])}</div><div class="mean">${esc(it[1])}</div><p class="mut small">Oyes la palabra, la repites en voz alta, la oyes otra vez y luego su significado. Mantén la pantalla encendida.</p></div>`);
 $('#ft').innerHTML=`<div class="row" style="margin:0"><button class="btn ghost" onclick="manosTog()">${G.play?'⏸ Pausa':'▶ Seguir'}</button><button class="btn" onclick="manosSkip()">⏭ Siguiente</button></div>`}
async function manosRun(){const my=G;while(my.play&&!my.stop){const it=my.it[my.i%my.it.length];manosUI();
 await sayP(it[0]);if(!my.play||my.stop)break;await wait(2400);if(!my.play||my.stop)break;await sayP(it[0],0,.7);if(!my.play||my.stop)break;await wait(500);await sayP(it[1],1);if(!my.play||my.stop)break;await wait(1600);if(!my.play||my.stop)break;my.i++;if(my.i%5==0)track2()}}
function track2(){const d=today();S.sec[d]=(S.sec[d]||0)+1;save()}
function manosTog(){G.play=!G.play;try{speechSynthesis.cancel()}catch(e){}if(G.play){G.stop=1;G={...G,stop:0};manosRun()}else manosUI()}
function manosSkip(){try{speechSynthesis.cancel()}catch(e){}G.stop=1;G={...G,stop:0,play:1,i:G.i+1};manosRun()}
/* Conjugador */
function gConj(i){openOv('tool');G={v:i||0};conjUI()}
function conjUI(){const v=VERBS[G.v];setLb(`<div class="tag">📖 Conjugador · presente</div><div class="vchips">${VERBS.map((x,i)=>`<button class="${i==G.v?'on':''}" onclick="G.v=${i};conjUI()">${esc(x[0])}</button>`).join('')}</div><div class="card"><div class="kk">${esc(v[1])}</div><div class="pw2" style="font-size:1.8rem;margin-bottom:6px">${esc(v[0])}</div>${v[2].map((f,i)=>`<button class="cj" data-s="${esc(vf(i,f))}" onclick="say(this.dataset.s)"><span class="mut" style="font-weight:700">${PRON[i]}</span><span><b>${esc(f)}</b> 🔊</span></button>`).join('')}</div><p class="small mut">Toca cada forma para oírla. ${esc(X.vnote)}</p>`);
 $('#ft').innerHTML=`<button class="btn w" onclick="conjQuiz(${G.v})">Practicar este verbo</button>`}
function conjQuiz(vi){const v=VERBS[vi],others=sh(VERBS.filter((x,i)=>i!=vi)).slice(0,2);openOv('mini');Q.title='Verbo '+v[0];Q.again='conjQuiz('+vi+')';
 const mk=(vv,i)=>{const f=vv[2][i],os=sh([f].concat(sh([...new Set(vv[2])].filter(x=>x!==f)).slice(0,2)));return{t:'gq',lab:'Elige la forma correcta · '+vv[0]+' ('+vv[1]+')',p:PRON[i].split(' · ')[0]+' ___',o:os,c:os.indexOf(f),sayc:vf(i,f)}};
 Q.items=sh(v[2].map((f,i)=>mk(v,i)).concat(others.map(x=>mk(x,Math.random()*x[2].length|0))));step()}
function vf(i,f){return f.includes("'")?f:PRA[i]+' '+f}
/* Conversas */
function convList(){let h=`<h3 style="margin-top:0">Conversa</h3><p class="mut">Tú eliges qué responder y la conversación cambia según lo que digas. Prueba otras respuestas la próxima vez.</p>`;const cu=nextIdx()/5;
 CONV.forEach((c,i)=>{const ok=cu>=c.need;h+=`<button class="card gm ${ok?'':'pc lk'}" style="--c:${UCS[i+1]};text-align:left" ${ok?`onclick="closeSheet();startConv(${i})"`:''}><span class="gme">${ok?c.ico:'🔒'}</span><span style="flex:1"><b>${c.t}</b><span class="small mut">${ok?'Con '+c.who:'Se abre al llegar a la unidad '+(c.need+1)}</span></span></button>`});
 sheet(h+`<button class="lnk" onclick="closeSheet()">Cerrar</button>`)}
function startConv(i){openOv('conv');G={c:CONV[i],node:'n0',err:0,ci:i};setLb(`<div class="tag">💬 ${esc(G.c.t)} · toca un globo para traducirlo</div><div class="chat" id="ch"></div>`);convNode()}
function bubble(who,pt,es,side){const n=document.createElement('div');n.className='msg '+side;n.innerHTML=`<div class="av">${side=='r'?'🙋🏻‍♂️':(AV[who]||'🙂')}</div><button class="bb"><div class="nm">${esc(side=='r'?'Tú':who)}</div>${side=='r'?`<div class="pt">${esc(pt)}</div><div class="es" hidden>${esc(es)}</div>`:'<div class="typing"><i></i><i></i><i></i></div>'}</button>`;$('#ch').appendChild(n);n.scrollIntoView({behavior:'smooth',block:'end'});
 const bb=n.querySelector('.bb');bb.onclick=()=>{say(pt);const s=bb.querySelector('.es');if(s)s.hidden=!s.hidden};return n}
function convNode(){const nd=G.c.n[G.node];$('#ft').innerHTML='';const n=bubble(G.c.who,nd[0],nd[1],'l');
 setTimeout(()=>{if(G.done)return;n.querySelector('.typing').outerHTML=`<div class="pt">${esc(nd[0])}</div><div class="es" hidden>${esc(nd[1])}</div>`;say(nd[0]);
  if(!nd[2].length){const gg=G;setTimeout(()=>{if(G===gg)convEnd()},1400);return}
  const os=sh(nd[2]);$('#ft').innerHTML=`<div class="copts">${os.map((o,k)=>`<button class="o" data-k="${k}">${esc(o[0])}<small>${esc(o[1])}</small></button>`).join('')}</div>`;
  $('#ft').querySelectorAll('.o').forEach(b=>b.onclick=()=>{const o=os[+b.dataset.k];
   if(!o[2]){b.classList.remove('bad');void b.offsetWidth;b.classList.add('bad');tone(0);G.err++;b.querySelector('small').textContent='Esa no encaja aquí. Prueba otra.';return}
   tone(1);$('#ft').innerHTML='';bubble('Tú',o[0],o[1],'r');say(o[0]);G.node=o[2];const gg=G;setTimeout(()=>{if(G===gg&&!gg.done)convNode()},1200)})},800)}
function convEnd(){if(!Q||!G||G.done)return;track();S.n.conv++;save();const c=G.c;

 $('#lb').lastElementChild.scrollIntoView({behavior:'smooth'});
 $('#ft').innerHTML=`<div class="row" style="margin:0"><button class="btn ghost" onclick="closeOv()">Salir</button><button class="btn" onclick="startConv(${G.ci})">Otra vez</button></div>`;confetti();checkBadges()}

 <h2 class="sec">💡 ${esc(l.g.h)}</h2><div class="card"><ul>${l.g.b.map(b=>`<li>${esc(b)}</li>`).join('')}</ul></div>
 <h2 class="sec">Ejemplos</h2>${l.g.e.map(x=>`<button class="exr" data-s="${esc(x[0])}" onclick="say(this.dataset.s)"><b>${esc(x[0])}</b><span>${esc(x[1])}</span><i>🔊</i></button>`).join('')}
 <h2 class="sec">Frases</h2>${l.s.map(x=>`<button class="exr" data-s="${esc(x[0])}" onclick="say(this.dataset.s)"><b>${esc(x[0])}</b><span>${esc(x[1])}</span><i>🔊</i></button>`).join('')}
 <div class="card" style="background:#FFF6D6;margin-top:16px"><b>✍️ Tarea</b><p class="small">Escribe cada palabra 3 veces a mano y dila en voz alta.</p></div></div>`);
 $('#ft').innerHTML=`<button class="btn w" onclick="copyT(nt(${u}),this,'Copiado para tu cuaderno ✓')">📋 Copiar para mi cuaderno</button>`}
