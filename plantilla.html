<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Tuca Idiomas</title>
<link rel="icon" href="icon-192.png">
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#FBF7F1">
<link rel="stylesheet" href="assets/fuentes.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Tuca Idiomas">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
/* Identidad propia: fresca y juguetona. Verde menta, amarillo sol y azul mar; Fredoka (redonda) para títulos y Nunito para leer.
   Tarjetas gruesas con sombra suave y botones con relieve, como fichas de juego. La mascota es Tuca, un tucán. */
:root{--bg:#F1F8F4;--card:#fff;--ink:#173B2F;--mut:#5F7B70;--line:#DDEEE5;--soft:#E8F4EE;--g:#12A06A;--gd:#0B7A50;--sun:#FFC531;--sund:#D9A300;--sea:#2E8BEA;--sead:#1F6CC0;--bad:#E5484D;--badd:#B8323A;--okbg:#DDF5E9;--badbg:#FDE7E7;
--fd:'Fredoka','Nunito',system-ui,sans-serif;--fb:'Nunito',system-ui,sans-serif;--sh:0 1px 0 var(--line),0 10px 28px rgba(18,90,60,.07);color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}html,body{overflow-x:hidden}
input,select,textarea{font-size:max(16px,1em)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--fb);font-size:17px;line-height:1.5;
padding:calc(10px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(118px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
body.lock{overflow:hidden}
#m{max-width:560px;margin:0 auto}
h1,h2,h3{font-family:var(--fd);font-weight:600;line-height:1.15;margin:0;text-wrap:balance}
h1.ttl{font-size:2rem;margin:12px 2px 4px}
.sec{font-family:var(--fd);font-weight:600;font-size:1.25rem;margin:26px 4px 8px}
.mut{color:var(--mut)}.small{font-size:.88rem}
p{margin:6px 0}
a{color:var(--sead);font-weight:700}
.view{animation:in .4s ease both}
.card{background:var(--card);border-radius:24px;padding:18px;margin:12px 0;box-shadow:var(--sh)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:default}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.btn{min-height:54px;padding:10px 22px;border-radius:18px;background:var(--g);color:#fff;font-family:var(--fd);font-weight:600;font-size:1.08rem;letter-spacing:.01em;display:inline-flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 5px 0 var(--gd);transition:transform .08s,box-shadow .08s}
.btn:active:not(:disabled){transform:translateY(5px);box-shadow:0 0 0 transparent}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 var(--line);border:2px solid var(--line)}
.btn.red{background:var(--bad);box-shadow:0 5px 0 var(--badd)}
.btn.sun{background:var(--sun);color:#3B2E00;box-shadow:0 5px 0 var(--sund)}
.btn.sea{background:var(--sea);box-shadow:0 5px 0 var(--sead)}
.w{width:100%}
.row{display:flex;gap:12px;margin:12px 0}.row>*{flex:1}.row.c{justify-content:center}.row.c>*{flex:0 0 auto}
.ic{width:52px;height:52px;border-radius:50%;background:#fff;border:2px solid var(--line);box-shadow:0 3px 0 var(--line);font-size:1.25rem;display:inline-grid;place-items:center;transition:transform .08s}
.ic:active{transform:translateY(3px);box-shadow:none}
.ic.s{width:40px;height:40px;font-size:1rem;vertical-align:middle;margin-left:8px}
.lnk{color:var(--sead);font-weight:800;padding:8px 4px}.lnk.red{color:var(--bad)}
.chipst{font-family:var(--fd);font-weight:600;background:#fff;border-radius:999px;padding:6px 12px;box-shadow:var(--sh);white-space:nowrap}

/* Barra flotante */
nav.bar{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;gap:10px;align-items:center;z-index:20;width:min(calc(100% - 28px),440px)}
.pill{flex:1;display:flex;background:rgba(255,255,255,.94);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-radius:999px;padding:6px;box-shadow:0 10px 30px rgba(18,70,50,.16)}
.pill button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:7px 4px 5px;border-radius:999px;font-size:.74rem;font-weight:800;color:var(--mut);transition:background .2s,color .2s}
.pill svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.pill button.on{background:var(--soft);color:var(--gd)}.pill button.on svg{transform:scale(1.1)}
.go{position:relative;width:66px;height:66px;border-radius:50%;background:var(--g);color:#fff;box-shadow:0 5px 0 var(--gd),0 12px 26px rgba(18,160,106,.35);display:grid;place-items:center;flex:none;transition:transform .08s}
.go:active{transform:translateY(5px);box-shadow:0 0 0 var(--gd)}
.go svg{width:26px;height:26px;fill:#fff;margin-left:3px}
.go.need::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:3px solid var(--g);animation:ring 2s infinite;pointer-events:none}

/* Aprender */
.head{display:flex;align-items:center;gap:8px;margin:4px 0 6px}
.tc{width:80px;height:80px;flex:none;padding:0}
.tc svg{width:100%;height:100%;animation:bob 3.2s ease-in-out infinite;overflow:visible}
.tc.hop svg{animation:hop .6s cubic-bezier(.3,1.6,.5,1)}
.sp{flex:1;position:relative;background:#fff;border-radius:18px;padding:10px 14px;box-shadow:var(--sh);line-height:1.3}
.sp::before{content:"";position:absolute;left:-7px;top:50%;margin-top:-7px;border:7px solid transparent;border-right-color:#fff;border-left:0}
.sp b{font-family:var(--fd);font-weight:600;font-size:1.12rem;display:block}.sp span{font-size:.88rem;color:var(--mut)}
.goal{display:flex;align-items:center;gap:16px}
.rw{position:relative;width:70px;height:70px;flex:none}
.ring{width:70px;height:70px;transform:rotate(-90deg)}
.rbg{fill:none;stroke:var(--soft);stroke-width:8}
.rfg{fill:none;stroke:var(--g);stroke-width:8;stroke-linecap:round;transition:stroke-dashoffset 1.3s cubic-bezier(.3,1,.4,1)}
.rtx{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--fd);font-weight:600;line-height:1}
.rtx small{font-family:var(--fb);font-size:.65rem;color:var(--mut);font-weight:700}
.week{display:flex;gap:6px;margin-top:8px}
.week span{width:26px;height:26px;border-radius:50%;background:var(--soft);display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;font-weight:800;color:var(--mut)}
.week span.on{background:var(--g);color:#fff;animation:pop .4s both}
.week span.today{box-shadow:0 0 0 2px var(--ink) inset}
.study{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:linear-gradient(135deg,#14B377,#0E8E5E);color:#fff;box-shadow:0 6px 0 var(--gd),0 14px 30px rgba(18,160,106,.28);transition:transform .08s}
.study:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gd)}
.sti{width:62px;height:62px;border-radius:20px;background:rgba(255,255,255,.2);display:grid;place-items:center;font-size:1.9rem;flex:none}
.stt{flex:1}.stt small{display:block;font-weight:800;font-size:.75rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85}
.stt b{display:block;font-family:var(--fd);font-weight:600;font-size:1.3rem;line-height:1.2}.stt span{font-size:.88rem;opacity:.92}
.stp{width:46px;height:46px;border-radius:50%;background:var(--sun);color:#3B2E00;display:grid;place-items:center;font-size:1.1rem;flex:none;box-shadow:0 3px 0 var(--sund)}
.hoyc .hr{display:flex;align-items:center;gap:14px;width:100%;text-align:left}
.hoyc .hr+.hr{border-top:2px dashed var(--line);margin-top:14px;padding-top:14px}
.bubble{width:58px;height:58px;border-radius:18px;background:var(--soft);display:grid;place-items:center;font-size:2rem;flex:none}
.float{animation:float 4s ease-in-out infinite}
.kk{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--g)}
.pw2{font-family:var(--fd);font-weight:600;font-size:1.3rem;line-height:1.2}
.seg{display:flex;gap:4px;padding:5px;background:#fff;border-radius:999px;margin:18px 0 6px;box-shadow:var(--sh)}
.seg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;font-size:.92rem;color:var(--mut);transition:background .2s,color .2s}
.seg button.on{background:var(--g);color:#fff}

/* Ruta */
.unit{display:flex;align-items:center;gap:12px;background:var(--c);color:#fff;border-radius:22px;padding:14px 16px;margin:24px 0 4px;box-shadow:0 5px 0 color-mix(in srgb,var(--c) 70%,#000)}
.un{width:38px;height:38px;border-radius:12px;background:rgba(255,255,255,.22);display:grid;place-items:center;font-family:var(--fd);font-weight:600;flex:none}
.ut{font-family:var(--fd);font-weight:600;font-size:1.15rem;line-height:1.2;flex:1}.ut small{display:block;font-family:var(--fb);font-size:.78rem;opacity:.85;font-weight:700}
.ug{width:44px;height:44px;border-radius:14px;background:rgba(255,255,255,.22);font-size:1.15rem}
.path{display:flex;flex-direction:column;align-items:center;gap:22px;padding:24px 0 6px}
.ndw{position:relative;display:flex;flex-direction:column;align-items:center}
.nd{position:relative;width:72px;height:68px;border-radius:50%;background:#DCE6E1;font-size:1.6rem;box-shadow:0 6px 0 #C2D0C9;transition:transform .08s}
.nd:active{transform:translateY(5px);box-shadow:0 1px 0 #C2D0C9}
.nd.dn,.nd.cur{background:var(--c);box-shadow:0 6px 0 color-mix(in srgb,var(--c) 68%,#000);color:#fff}
.nd.dn{font-size:1.5rem;font-family:var(--fd);font-weight:600}
.nd.cur::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--c);animation:ring 2s infinite;pointer-events:none}
.nd.lk{font-size:1.1rem;opacity:.8}
.nl{font-size:.76rem;font-weight:700;color:var(--mut);margin-top:8px}
.bub{position:absolute;top:-38px;background:#fff;color:var(--c);font-family:var(--fd);font-weight:600;font-size:.8rem;letter-spacing:.06em;padding:5px 12px;border-radius:12px;white-space:nowrap;box-shadow:var(--sh);animation:bob 2.2s ease-in-out infinite}
.bub::after{content:"";position:absolute;left:50%;bottom:-6px;margin-left:-6px;border:6px solid transparent;border-top-color:#fff;border-bottom:0}

/* Viaje */
.map{background:linear-gradient(#DFF1FB,#CDE9F8);padding:10px}
.map svg{width:100%;height:auto;display:block}
.pin{cursor:pointer}
.pin .pr{transform-box:fill-box;transform-origin:center;animation:ring 2s infinite}
.route{stroke-dasharray:6 6}
.done-route{stroke-dasharray:var(--l);stroke-dashoffset:var(--l);animation:draw 1.6s .3s ease forwards}
.pc{display:flex;gap:14px;align-items:center;width:100%;text-align:left}
.pc.lk{opacity:.55}
.pce{width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;flex:none;background:var(--soft)}
.post{border-radius:24px;padding:22px;color:#fff;text-align:left;background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#000));position:relative;overflow:hidden;animation:pop .5s both}
.post .pe1{position:absolute;right:-6px;bottom:-14px;font-size:6rem;opacity:.9;transform:rotate(-8deg)}
.post h3{font-size:1.6rem;margin:2px 0 8px}.post p{max-width:78%;font-size:.95rem;line-height:1.45}
.post .stamp{display:inline-block;border:2px dashed rgba(255,255,255,.7);border-radius:10px;padding:2px 10px;font-size:.75rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase}
.phr{display:block;margin-top:12px;background:rgba(255,255,255,.18);border-radius:14px;padding:10px 12px;color:#fff;text-align:left;max-width:80%}

/* Jugar / Yo */
.gm{display:flex;gap:14px;align-items:center;width:100%;text-align:left;transition:transform .08s}
.gm:active{transform:scale(.98)}
.gme{width:58px;height:58px;border-radius:18px;display:grid;place-items:center;font-size:1.8rem;background:color-mix(in srgb,var(--c) 16%,#fff);flex:none}
.gm b{font-family:var(--fd);font-weight:600;font-size:1.12rem;display:block}
.gm .rec{display:block;font-size:.8rem;font-weight:800;color:var(--c);margin-top:2px}
.stg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.stg div{background:var(--soft);border-radius:18px;padding:12px 14px}
.stg b{display:block;font-family:var(--fd);font-weight:600;font-size:1.6rem;line-height:1.1}.stg span{font-size:.82rem;color:var(--mut);font-weight:700}
.chart{display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:10px}
.chart div{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.chart i{display:block;width:100%;border-radius:8px 8px 4px 4px;background:var(--g);min-height:4px;transform-origin:bottom;animation:grow .8s cubic-bezier(.3,1.3,.5,1) both}
.chart i.z{background:var(--line)}
.chart span{font-size:.72rem;font-weight:800;color:var(--mut)}.chart small{font-size:.68rem;color:var(--mut)}
.bdg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bdg button{background:var(--soft);border-radius:18px;padding:12px 6px;text-align:center;font-size:.76rem;font-weight:800;line-height:1.2}
.bdg .be{display:block;font-size:2rem;margin-bottom:4px}
.bdg .off{opacity:.45;filter:grayscale(1)}
.bdg .on{background:#FFF6D6}
details{background:#fff;border-radius:18px;margin:8px 0;box-shadow:var(--sh)}
summary{list-style:none;cursor:pointer;padding:12px 16px;display:flex;align-items:center;gap:12px;min-height:54px;font-weight:800}
summary::-webkit-details-marker{display:none}
summary::after{content:"";margin-left:auto;width:8px;height:8px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;flex:none}
details[open]>summary::after{transform:rotate(-135deg)}
.dl{padding:0 16px 10px}
.wr{display:grid;grid-template-columns:40px 1fr auto;width:100%;text-align:left;padding:9px 0;border-top:2px solid var(--soft);align-items:center;column-gap:10px}
.wr .we{grid-row:1/3;font-size:1.5rem}.wr .mut{grid-column:2;font-size:.88rem}
.lv{grid-row:1/3;grid-column:3;display:flex;gap:3px}.lv i{width:7px;height:7px;border-radius:50%;background:var(--line)}.lv i.on{background:var(--g)}
.sg{display:flex;gap:4px;padding:4px;background:var(--soft);border-radius:999px;margin:8px 0}
.sg button{flex:1;min-height:42px;border-radius:999px;font-weight:800;font-size:.9rem;color:var(--mut)}
.sg button.on{background:#fff;color:var(--ink);box-shadow:0 2px 0 var(--line)}
.sw{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 0;border-top:2px solid var(--soft);margin-top:10px}
.sw small{display:block;color:var(--mut);font-size:.8rem}
.tg{width:52px;height:32px;border-radius:16px;background:#CFDAD4;position:relative;transition:background .2s;flex:none}
.tg i{position:absolute;top:3px;left:3px;width:26px;height:26px;border-radius:50%;background:#fff;transition:transform .2s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.tg.on{background:var(--g)}.tg.on i{transform:translateX(20px)}
.lbl{font-size:.8rem;font-weight:800;color:var(--g);letter-spacing:.06em;text-transform:uppercase}
input,textarea{width:100%;font:inherit;font-size:1.1rem;padding:14px 16px;border-radius:18px;border:2px solid var(--line);background:#fff;color:var(--ink);margin:8px 0}
input:focus,textarea:focus{border-color:var(--g);outline:0}
textarea{font-size:16px}

/* Pantalla de sesión */
.ov{position:fixed;inset:0;background:var(--bg);z-index:40;display:flex;flex-direction:column;padding:calc(8px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.ov.in{animation:up .38s cubic-bezier(.2,.8,.2,1)}
.oh{display:flex;align-items:center;gap:12px;max-width:560px;width:100%;margin:0 auto;padding:6px 0}
.x{font-size:1.25rem;color:var(--mut);width:40px;height:40px;border-radius:50%;font-weight:800}
.pb{flex:1;height:14px;background:#DCE9E2;border-radius:8px;overflow:hidden}
.pb i{display:block;position:relative;height:100%;width:0;background:var(--g);border-radius:8px;transition:width .5s cubic-bezier(.3,1.3,.5,1)}
.pb i::after{content:"";position:absolute;left:8px;right:8px;top:3px;height:3px;border-radius:2px;background:rgba(255,255,255,.35)}
#cmb{min-width:48px;text-align:right;font-family:var(--fd);font-weight:600;color:#F08A24}
#lb{flex:1;overflow-y:auto;max-width:560px;width:100%;margin:0 auto;padding:8px 2px 24px;-webkit-overflow-scrolling:touch}
#ft{max-width:560px;width:100%;margin:0 auto;padding:10px 0 calc(18px + env(safe-area-inset-bottom,0px))}
.fbk{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:18px max(20px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(110%);transition:transform .3s cubic-bezier(.2,.9,.3,1.12);border-radius:26px 26px 0 0}
.fbk>*{max-width:560px;margin-left:auto;margin-right:auto}
.fbk.show{transform:none}.fbk.good{background:var(--okbg);color:#0E5A3A}.fbk.bad{background:var(--badbg);color:#932A2E}
.fbh{font-family:var(--fd);font-weight:600;font-size:1.45rem}.fbt{font-weight:800;margin:4px 0}.fbn{font-size:.9rem;margin:2px 0}
.fbk .btn{margin-top:12px}
.ex.in{animation:exIn .42s cubic-bezier(.2,.8,.2,1) both}
.tag{font-size:.8rem;font-weight:800;color:var(--mut);text-transform:uppercase;letter-spacing:.07em;margin:8px 0 10px}
.qq{font-family:var(--fd);font-weight:600;font-size:1.9rem;margin:8px 0 18px;line-height:1.2;overflow-wrap:anywhere}
.qq.sm{font-size:1.35rem}
.emo{font-size:5rem;text-align:center;line-height:1;margin:18px auto 10px;width:150px;height:150px;border-radius:44px;background:#fff;box-shadow:var(--sh);display:grid;place-items:center}
.emo.sm{width:96px;height:96px;font-size:3rem;border-radius:30px}
.pw{font-family:var(--fd);font-weight:600;font-size:2.4rem;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.pron{text-align:center;color:var(--mut);margin:6px 0;font-weight:700}
.mean{text-align:center;font-size:1.25rem;font-weight:800;color:var(--g);margin:4px 0 14px}
.col{display:flex;flex-direction:column;gap:10px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.o{display:block;width:100%;text-align:left;min-height:56px;padding:13px 16px;border-radius:18px;background:#fff;border:2px solid var(--line);border-bottom-width:5px;font-size:1.03rem;font-weight:700;transition:transform .08s,background .2s,border-color .2s}
.o:active:not(:disabled){transform:translateY(3px);border-bottom-width:2px}
.o:disabled{opacity:1}
.o.sel{border-color:var(--sea);background:#EAF3FE}
.o.ok{border-color:var(--g);background:var(--okbg);color:#0E5A3A;animation:pop .35s}
.o.bad{border-color:var(--bad);background:var(--badbg);color:#932A2E;animation:shake .4s}
.o.gone{opacity:.25;pointer-events:none;transition:opacity .4s .25s}
.pic{text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;padding:16px 8px}
.pe{font-size:2.6rem;line-height:1}
.mo{text-align:center}
.spk{display:flex;justify-content:center;align-items:center;gap:14px;margin:18px 0 20px}
.bigs{position:relative;width:100px;height:100px;border-radius:32px;background:var(--sea);color:#fff;font-size:2.3rem;box-shadow:0 6px 0 var(--sead)}
.bigs:active{transform:translateY(5px);box-shadow:none}
.bigs i{position:absolute;inset:0;border-radius:32px;border:3px solid var(--sea);animation:wave 2.2s infinite;pointer-events:none}.bigs i+i{animation-delay:1.1s}
.hint{color:var(--mut);font-size:.88rem;text-align:center;margin:8px 0}
.qlnk{display:block;margin:14px auto 0;color:var(--mut);font-weight:800;font-size:.85rem}
.ans{min-height:64px;border-bottom:2px solid var(--line);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0;margin-bottom:20px}
.bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}

<style id="diseno2">
/* Diseño 2 (nov 2026): naranja Tuca para marca y acciones; el verde queda solo para «correcto». Fondo cálido. */
:root{--bg:#FBF7F1;--line:#EFE6DA;--soft:#F6EEE4;--pri:#EE6A1F;--prid:#C4520F;--pris:#FDEBDD;--ink:#1F2A26;--mut:#6B7470;
--sh:0 1px 0 var(--line),0 10px 28px rgba(90,60,30,.07);--e:cubic-bezier(.2,.8,.2,1)}
.btn{background:var(--pri);box-shadow:0 5px 0 var(--prid)}.btn:active{box-shadow:0 0 0 var(--prid)}
.pb{background:var(--line)}
.fbk.good .btn{background:var(--g);box-shadow:0 5px 0 var(--gd)}.fbk.bad .btn{background:var(--bad);box-shadow:0 5px 0 var(--badd)}
.kk,.lbl{color:var(--pri)}
.seg button.on,.vchips button.on,.week span.on,.tg.on,.dots i.on{background:var(--pri)}
.dots i.done{background:color-mix(in srgb,var(--pri) 40%,#fff)}
.rfg{stroke:var(--pri)}.chart i{background:var(--pri)}.gbig{color:var(--pri)}.cj b{color:var(--prid)}.lv i.on{background:var(--pri)}
input:focus,textarea:focus{border-color:var(--pri)}
.study{background:linear-gradient(135deg,#F7813A,#E25E14);box-shadow:0 6px 0 var(--prid),0 14px 30px rgba(226,94,20,.26)}
.study:active{box-shadow:0 1px 0 var(--prid)}
/* barra inferior: un solo bloque con «Estudiar» integrado */
.bar .pill{flex:1;align-items:stretch}
.pill button.on{color:var(--prid)}
.pill .ind{background:var(--pris)}
.pill .go{position:relative;width:auto;height:auto;flex:1.15;border-radius:999px;background:var(--pri);color:#fff;box-shadow:0 3px 0 var(--prid),0 8px 18px rgba(226,94,20,.28);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:6px 4px 5px;margin-left:4px;font-size:.74rem;font-weight:800;z-index:1}
.pill .go:active{transform:translateY(3px);box-shadow:0 0 0 var(--prid)}
.pill .go .gob{display:grid;place-items:center;height:23px}
.pill .go svg{width:19px;height:19px;fill:#fff;stroke:none;margin-left:2px}
.pill .go.need::after{inset:-4px;border-radius:999px;border-color:var(--pri)}
/* iconos de línea en lugar de emojis en el menú */
.li{width:1em;height:1em;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-.14em;display:inline-block}
.gme .li{width:28px;height:28px;color:color-mix(in srgb,var(--c) 85%,#000)}
.sti .li{width:30px;height:30px;color:#fff}.stp .li{width:22px;height:22px;fill:currentColor}
.bdg .li{width:30px;height:30px;color:var(--pri);display:block;margin:2px auto 6px}.bdg .off .li{color:var(--mut);opacity:.55}
.nd .li{width:26px;height:26px}.ug .li{width:20px;height:20px}.seg .li{width:17px;height:17px;margin-right:4px}
.shi .li{width:34px;height:34px}.te .li{width:26px;height:26px;color:var(--pri)}
.chipst .li{color:var(--pri)}.pce .li{width:24px;height:24px;color:var(--mut)}
.bigi .li{width:64px;height:64px;color:var(--pri);stroke-width:1.6}
/* transiciones entre pestañas (View Transitions) */
.bar{view-transition-name:barra}
::view-transition-old(root){animation:vtOut .26s var(--e) both}
::view-transition-new(root){animation:vtIn .42s var(--e) both}
html[data-vt=l]::view-transition-old(root){animation-name:vtOutL}
html[data-vt=l]::view-transition-new(root){animation-name:vtInL}
::view-transition-group(barra){animation:none}
@keyframes vtOut{to{opacity:0;transform:translateX(-36px) scale(.985);filter:blur(2px)}}
@keyframes vtIn{from{opacity:0;transform:translateX(44px) scale(.985);filter:blur(3px)}}
@keyframes vtOutL{to{opacity:0;transform:translateX(36px) scale(.985);filter:blur(2px)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-44px) scale(.985);filter:blur(3px)}}
/* entrada escalonada de tarjetas */
.view>*{animation:rise .5s var(--e) both}
.view>*:nth-child(2){animation-delay:.04s}.view>*:nth-child(3){animation-delay:.08s}.view>*:nth-child(4){animation-delay:.12s}
.view>*:nth-child(5){animation-delay:.16s}.view>*:nth-child(6){animation-delay:.2s}.view>*:nth-child(n+7){animation-delay:.24s}
/* ejercicios: la tarjeta entra deslizando y la barra avanza con resorte */
.ex.in{animation:exIn2 .3s var(--e) both}
@keyframes exIn2{from{opacity:0;transform:translateX(48px) scale(.98)}to{opacity:1;transform:none}}
.pb i{background:linear-gradient(90deg,var(--pri),#F7A23A);transition:width .6s cubic-bezier(.34,1.56,.64,1)}
.vnote{display:flex;gap:10px;align-items:flex-start;background:var(--pris);border-radius:16px;padding:12px 14px;margin:10px 0;font-size:.9rem;color:#6A3A12}
.vnote .li{color:var(--pri);width:20px;height:20px;flex:none;margin-top:2px}
@media (prefers-reduced-motion:reduce){.view>*,.ex.in{animation:none!important}::view-transition-old(root),::view-transition-new(root){animation:none!important}}
</style>

/* Diseño 2: cambia los emojis del menú por iconos de línea. Las tarjetas de palabras (#ov) conservan sus emojis. */
(function(){
const I={'🃏':'layers','🗂':'book-open','💡':'lightbulb','💬':'message-circle','🏆':'trophy','🧩':'shuffle','⚡':'zap','🎧':'headphones','🤔':'target','👂':'volume-2','🎙':'mic','🚗':'car','📖':'book-open','🌱':'sparkles','🔥':'flame','📚':'book-open','🧠':'lightbulb','💎':'star','🎯':'target','🏅':'award','🗺':'map','🌍':'plane','🎮':'gamepad-2','⏱':'clock','🔒':'lock','📓':'notebook-pen','🛤':'route','▶':'play','🔊':'volume-2','🧭':'compass'};
const K=Object.keys(I).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|');
const RX=new RegExp('('+K+')\\uFE0F?','g'),RX1=new RegExp('('+K+')');
const SKIP='.ut,.bubble,.wc,.exr,textarea,script,.cf';
const ico=n=>'<svg class="li" aria-hidden="true"><use href="#i-'+n+'"/></svg>';
function deco(root){if(!root)return;const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT),L=[];
 while(w.nextNode()){const t=w.currentNode;if(RX1.test(t.nodeValue)&&!(t.parentNode.closest&&t.parentNode.closest(SKIP)))L.push(t)}
 L.forEach(t=>{const sp=document.createElement('span');sp.innerHTML=t.nodeValue.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c])).replace(RX,(m,e)=>ico(I[e]));sp.style.display='contents';t.replaceWith(sp)})}
window.decoIcons=deco;
['#m','#shc','#toast'].forEach(s=>{const el=document.querySelector(s);if(!el)return;deco(el);new MutationObserver(()=>deco(el)).observe(el,{childList:true,subtree:true})});

})();
